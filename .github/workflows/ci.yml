name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Lint
        run: |
          npm run lint --prefix backend
          npm run lint --prefix frontend

      - name: Build the frontend
        run: npm run build --prefix frontend

      # CI's own backend/.env. make-env.js (run by e2e/prepare.js) copies it to .env.test with
      # billsy_test, a new JWT secret, new E2E_PASSWORD and two new Ethereal inboxes, so no real
      # mail is ever sent. Nothing here is a real secret.
      - name: Write backend/.env
        run: |
          cat > backend/.env <<EOF
          NODE_ENV=development
          PORT=4000
          LOG_LEVEL=warn
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=billsy
          DB_USER=root
          DB_PASSWORD=ci-root-password
          JWT_SECRET=$(openssl rand -base64 48)
          FRONTEND_URL=http://localhost:5173
          SMTP_HOST=smtp.ethereal.email
          SMTP_PORT=587
          SMTP_USER=replaced-by-make-env
          SMTP_PASS=replaced-by-make-env
          SMTP_FROM="Billsy <no-reply@billsy.test>"
          DEMO_MODE=true
          DEMO_PASSWORD=ci-demo-password-1
          EOF

      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Playwright (API + browser)
        working-directory: e2e
        env:
          CI: 'true'
        run: npm test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker image starts and serves the app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: billsy_demo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t billsy .
      - name: Run (migrations on start) and check the page and the API
        run: |
          docker run -d --name billsy --network host \
            -e PORT=4000 -e TRUST_PROXY=1 -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_NAME=billsy_demo \
            -e DB_USER=root -e DB_PASSWORD=ci-root-password -e JWT_SECRET=$(openssl rand -hex 32) \
            -e FRONTEND_URL=http://127.0.0.1:4000 -e SMTP_HOST=smtp.ethereal.email -e SMTP_PORT=587 \
            -e SMTP_USER=none -e SMTP_PASS=none -e SMTP_FROM=no-reply@billsy.test \
            -e DEMO_MODE=true -e DEMO_PASSWORD=ci-demo-password-1 billsy
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:4000/api/health
          curl -fs http://127.0.0.1:4000/invoices | grep -q '<div id="root">'
          docker exec billsy npm run seed:demo
          curl -fs http://127.0.0.1:4000/api/demo/accounts | grep -q 'owner@demo.billsy.test'
      - name: Container log
        if: always()
        run: docker logs billsy || true
