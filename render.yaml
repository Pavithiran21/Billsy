# Render Blueprint: one free web service from the Dockerfile (API + built frontend on one origin).
# The database is an external MySQL 8.4 (e.g. Aiven's free MySQL); create the billsy_demo database
# there, set the secrets below in the Render dashboard, then run once from the service's Shell:
#   npm run seed:demo
# Free services sleep after 15 minutes without traffic; the first visit then takes about a minute.
services:
  - type: web
    name: billsy
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_LEVEL
        value: info
      - key: DB_NAME
        value: billsy_demo
      - key: DEMO_MODE
        value: 'true'
      - key: RATE_LIMITS_ENABLED
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # https://<service>.onrender.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false # Aiven's CA certificate (PEM)
      - key: DEMO_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEMO_SMTP_HOST
        sync: false
      - key: DEMO_SMTP_PORT
        sync: false
      - key: DEMO_SMTP_USER
        sync: false
      - key: DEMO_SMTP_PASS
        sync: false
