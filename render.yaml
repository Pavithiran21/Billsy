# Render Blueprint: one free web service for the API only (Dockerfile.api). The React app is hosted on
# Vercel (Root Directory: frontend); its vercel.json forwards /api/* to this service, so the browser sees
# one origin and the refresh cookie keeps working. Set FRONTEND_URL below to the Vercel URL.
# The database is TiDB Cloud Starter (free, MySQL 8.0 compatible) with the database billsy_demo. Free
# Render services have no Shell, so seed it once from your own machine, with an env file that points
# at the TiDB cluster (ENV_FILE=...):
#   npx knex migrate:latest && npm run seed:demo
# TiDB: allow access from anywhere (0.0.0.0/0) under the cluster's networking, so Render can connect.
# Free services sleep after 15 minutes without traffic; the first visit then takes about a minute.
services:
  - type: web
    name: billsy-pavithiran
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '2' # two hops: Vercel's rewrite, then Render's proxy, so rate limits see the visitor's IP
      - key: LOG_LEVEL
        value: info
      - key: DB_NAME
        value: billsy_demo
      - key: DEMO_MODE
        value: 'true'
      - key: RATE_LIMITS_ENABLED
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # the Vercel URL, https://<project>.vercel.app (CORS and the links in emails)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false # the ISRG Root X1 certificate (PEM) that TiDB Cloud's certificate chains to, on one line with \n
      - key: DEMO_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEMO_SMTP_HOST
        sync: false
      - key: DEMO_SMTP_PORT
        sync: false
      - key: DEMO_SMTP_USER
        sync: false
      - key: DEMO_SMTP_PASS
        sync: false
